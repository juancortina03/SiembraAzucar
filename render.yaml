services:
  # -- Web Service: Dash dashboard --
  - type: web
    name: siembra-azucar
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn dashboard:server --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DASH_USER
        sync: false        # set in Render dashboard
      - key: DASH_PASS
        sync: false        # set in Render dashboard
      - key: FRED_API_KEY
        sync: false
      - key: BANXICO_TOKEN
        sync: false
    plan: free
    autoDeploy: true

  # -- Cron Job: daily data refresh --
  - type: cron
    name: siembra-azucar-daily-update
    runtime: python
    # Simple build: just pip install. Playwright/Chromium is NOT installed
    # because Render's default Python buildpack can't install Chromium's
    # system dependencies without root. The CONADESUCA scrapers that need
    # it are skipped cleanly by daily_update.py when playwright_is_ready()
    # returns False. Result: SNIIM daily prices + ML retrain still refresh.
    buildCommand: pip install -r requirements.txt
    startCommand: python daily_update.py
    schedule: "0 12 * * *"   # 12:00 UTC = 6:00 AM Mexico (Jalisco, no DST since 2022)
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FRED_API_KEY
        sync: false
      - key: BANXICO_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false        # GitHub PAT with repo write access
      - key: GITHUB_REPO
        value: "juancortina03/SiembraAzucar"
    plan: starter
