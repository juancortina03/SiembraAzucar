services:
  # -- Web Service: Dash dashboard --
  - type: web
    name: siembra-azucar
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn dashboard:server --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DASH_USER
        sync: false        # set in Render dashboard
      - key: DASH_PASS
        sync: false        # set in Render dashboard
      - key: FRED_API_KEY
        sync: false
      - key: BANXICO_TOKEN
        sync: false
    plan: free
    autoDeploy: true

  # -- Cron Job: daily data refresh --
  - type: cron
    name: siembra-azucar-daily-update
    runtime: python
    # System libraries required by Chromium (Playwright).
    # --with-deps cannot be used on Render because the build phase
    # runs as a non-root user that can't apt-get install.
    aptPackages:
      - libnss3
      - libnspr4
      - libatk1.0-0
      - libatk-bridge2.0-0
      - libcups2
      - libxkbcommon0
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxrandr2
      - libgbm1
      - libasound2
      - libpango-1.0-0
      - libcairo2
    buildCommand: pip install -r requirements.txt && playwright install chromium || echo "Playwright install failed; CONADESUCA scrapers will be skipped"
    startCommand: python daily_update.py
    schedule: "0 12 * * *"   # every day at 12:00 UTC (~6am CST)
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FRED_API_KEY
        sync: false
      - key: BANXICO_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false        # GitHub PAT with repo write access
      - key: GITHUB_REPO
        value: "juancortina03/SiembraAzucar"
    plan: starter
